<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- ===== Registration card ===== -->
  <main class="card">
    <h1>User Registration</h1>
    <p class="subtitle">Fill in your details to create an account</p>

    <form id="regForm" novalidate>

      <!-- First & Second name -->
      <div class="row">
        <div class="form-group" id="g-first">
          <label for="firstName">First Name <span class="req">*</span></label>
          <input type="text" id="firstName" placeholder="e.g. Ali" autocomplete="given-name">
          <div class="error" id="e-first"></div>
        </div>

        <div class="form-group" id="g-second">
          <label for="secondName">Second Name <span class="req">*</span></label>
          <input type="text" id="secondName" placeholder="e.g. Khan" autocomplete="family-name">
          <div class="error" id="e-second"></div>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group" id="g-email">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" placeholder="name@example.com" autocomplete="email">
        <div class="error" id="e-email"></div>
      </div>

      <!-- Phone & Age -->
      <div class="row">
        <div class="form-group" id="g-phone">
          <label for="phone">Phone Number <span class="req">*</span></label>
          <input type="tel" id="phone" placeholder="03XXXXXXXXX" maxlength="11" autocomplete="tel">
          <div class="error" id="e-phone"></div>
        </div>

        <div class="form-group" id="g-age">
          <label for="age">Age <span class="req">*</span></label>
          <input type="number" id="age" placeholder="e.g. 25" min="1" max="120">
          <div class="error" id="e-age"></div>
        </div>
      </div>

      <!-- Gender -->
      <div class="form-group" id="g-gender">
        <fieldset>
          <legend>Gender <span class="req">*</span></legend>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="gender" value="Male"> Male
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="Female"> Female
            </label>
          </div>
        </fieldset>
        <div class="error" id="e-gender"></div>
      </div>

      <!-- City -->
      <div class="form-group" id="g-city">
        <label for="city">City <span class="req">*</span></label>
        <select id="city">
          <option value="">-- Select your city --</option>
          <option value="Islamabad">Islamabad</option>
          <option value="Lahore">Lahore</option>
          <option value="Karachi">Karachi</option>
          <option value="Peshawar">Peshawar</option>
          <option value="Quetta">Quetta</option>
          <option value="Rawalpindi">Rawalpindi</option>
        </select>
        <div class="error" id="e-city"></div>
      </div>

      <!-- Address -->
      <div class="form-group" id="g-address">
        <label for="address">Complete Address <span class="req">*</span></label>
        <textarea id="address" placeholder="House no, street, area..." autocomplete="street-address"></textarea>
        <div class="error" id="e-address"></div>
      </div>

      <button type="submit">Submit</button>
    </form>

    <!-- ===== Output section ===== -->
    <section class="output" aria-live="polite">
      <h2>Output</h2>
      <div id="outputBox">
        <p class="placeholder">Submitted data will appear here.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
